<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Docly</title>
<style>
/* ===== ЦВЕТА И РАЗМЕРЫ: меняйте здесь ===== */
:root{--blue:#2F6BFF;--blue-d:#1E3FB2;--navy:#0A1450;--soft:#EAF1FF;--soft2:#C3D7FC;--field:#F3F6FD;--line:#E6ECF8;--text:#0B1330;--mut:#6B7794;--red:#E5484D;--sh:0 8px 28px rgba(47,107,255,.10);--side:248px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Manrope,-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:#fff;color:var(--text);min-height:100vh}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden}body.lock{position:fixed;left:0;right:0;overflow:hidden}
.ov{overscroll-behavior:contain}.sb{overscroll-behavior:contain;touch-action:pan-y}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* Навигация */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:#fff;z-index:10;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:24px;letter-spacing:-.02em;padding:0 10px 22px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#5B8DFF,var(--blue-d));color:#fff;display:grid;place-items:center}
.nv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;color:var(--mut);font-weight:700;font-size:15px;text-align:left;transition:.2s}
.nv:hover{background:var(--field);color:var(--text)}.nv.on{background:var(--soft);color:var(--blue)}
.main{margin-left:var(--side);padding:36px 40px 60px}.pg{max-width:1040px;margin:0 auto;min-width:0}
.tabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-around;align-items:center;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 8px;border-radius:16px;color:var(--mut);font-size:11px;font-weight:700;min-width:62px;transition:.2s}
.tb.on{color:var(--blue);background:var(--soft)}
.tb.add{color:#fff;background:var(--blue);width:56px;height:56px;min-width:0;padding:0;border-radius:50%;margin-top:-28px;justify-content:center;box-shadow:0 10px 24px rgba(47,107,255,.4)}
.tb.add svg{width:26px;height:26px}
/* Заголовки и поиск */
.pg{animation:up .45s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.top h1{font-size:34px;letter-spacing:-.03em;font-weight:800}
.top p{color:var(--mut);margin-top:4px;font-weight:600}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#7BA4FF,var(--blue-d));color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;box-shadow:var(--sh);flex:none}
.av.big{width:84px;height:84px;font-size:32px}
.sr{display:flex;align-items:center;gap:12px;background:var(--field);border:2px solid transparent;border-radius:20px;padding:0 20px;height:58px;color:var(--mut);transition:.25s}
.sr:focus-within{background:#fff;border-color:var(--blue);box-shadow:0 0 0 5px rgba(47,107,255,.12);color:var(--blue)}
.sr input{flex:1;border:0;outline:0;background:none;font-size:16px;font-weight:600;color:var(--text);min-width:0}
.hero{position:relative;overflow:hidden;margin-top:18px;padding:26px;border-radius:28px;color:#fff;background:linear-gradient(135deg,#4F86FF,#2B54E0 60%,#1E3FB2);box-shadow:0 18px 40px rgba(47,107,255,.28)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:before{width:220px;height:220px;right:-60px;top:-80px}.hero:after{width:120px;height:120px;right:90px;bottom:-60px}
.hero small{opacity:.85;font-weight:700;font-size:14px}.hero b{display:block;font-size:40px;letter-spacing:-.03em;margin:4px 0 14px}
.hs{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}.hs span{background:rgba(255,255,255,.18);padding:8px 14px;border-radius:14px;font-weight:700;font-size:13px}
.hero{min-height:200px;padding-right:240px}
.hero:before{width:260px;height:260px;right:-30px;top:auto;bottom:-70px;background:rgba(255,255,255,.2)}
.hero .tx{position:relative;z-index:1}.hero small{display:block;margin-bottom:10px}
.hero b{display:inline;font-size:48px;margin:0}.hero em{font-style:normal;font-weight:700;font-size:20px;margin-left:8px}.hs{margin-top:16px}
.mascot{position:absolute;right:18px;bottom:0;height:190px;width:auto;z-index:1;animation:fl 4s ease-in-out infinite;will-change:transform}
@keyframes fl{50%{transform:translateY(-8px)}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile{aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:16px;border-radius:24px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);transition:.25s;animation:up .5s both;animation-delay:var(--d)}
.tile:hover{transform:translateY(-4px)}.tile:active{transform:scale(.96)}
.tile .ci{margin:0}.tile b{display:block;font-size:15px;margin-bottom:2px}.tile span{color:var(--mut);font-size:12.5px;font-weight:600}
.fh{display:flex;justify-content:space-between;align-items:center;width:100%;margin:30px 0 10px;text-align:left}.fh h2{font-size:21px;letter-spacing:-.02em}
.fh span{display:flex;align-items:center;gap:8px;color:var(--mut);font-weight:700;font-size:14px}.fh svg{transition:.3s}.fh.open svg{transform:rotate(180deg)}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}.fold.open{grid-template-rows:1fr}
.fold>div{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .4s}.fold.open>div{visibility:visible;transition:none}.fold .list{padding:6px 4px}
.row{display:flex;align-items:center;gap:14px;font-weight:700}.row .ci{margin:0;width:40px;height:40px;border-radius:13px}.row .ci svg{width:19px;height:19px}.row>div:nth-child(2){flex:1}.row small{display:block;color:var(--mut);font-weight:600;font-size:13px;margin-top:2px}
.sw{position:relative;width:52px;height:30px;flex:none;cursor:pointer}.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1;margin:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:#D5DDF0;transition:.25s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(10,20,80,.25);transition:.25s}
.sw input:checked+i{background:var(--blue)}.sw input:checked+i:after{transform:translateX(22px)}
.cta{width:100%;height:60px;margin-top:16px;border-radius:20px;background:var(--navy);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s;box-shadow:0 12px 26px rgba(10,20,80,.25)}
.cta:hover{filter:brightness(1.25)}
.cta:active,.btn:active,.ib:active,.cat:active{transform:scale(.96)}
.sec{margin:30px 0 14px}.sec h2{font-size:21px;letter-spacing:-.02em}
/* Категории */
.cats{display:flex;gap:14px;overflow-x:auto;padding:6px 4px 18px;margin:0 -4px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{min-width:158px;text-align:left;padding:18px;border-radius:24px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);transition:.25s;animation:up .5s both;animation-delay:var(--d)}
.cat:hover{transform:translateY(-4px)}
.ci{width:46px;height:46px;border-radius:15px;background:var(--soft);color:var(--blue);display:grid;place-items:center;margin-bottom:14px}
.cat b{display:block;font-size:15px;margin-bottom:2px}.cat span{color:var(--mut);font-size:13px;font-weight:600}
/* Карточки документов */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.dc{position:relative;display:grid;grid-template-columns:72px 1fr;gap:12px 16px;padding:16px;border-radius:24px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer;transition:.25s;animation:up .5s both;animation-delay:var(--d)}
.dc:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(47,107,255,.16)}
.th{width:72px;height:72px;border-radius:20px;overflow:hidden;background:var(--soft);display:grid;place-items:center}.th img{width:100%;height:100%;object-fit:cover}
.th.pdf{background:linear-gradient(135deg,#6C9BFF,var(--blue));color:#fff;align-content:center;gap:2px}.th.pdf b{font-size:11px;letter-spacing:.08em}
.inf{min-width:0;padding-right:26px}.inf h3{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 6px}
.inf p{font-size:13px;color:var(--mut);font-weight:600;line-height:1.5}
.acts{grid-column:1/-1;display:flex;gap:8px}.acts .btn{flex:1}
.fv{position:absolute;top:14px;right:14px;color:#F5B301}.fv svg{fill:currentColor;width:18px;height:18px}
.btn{height:42px;padding:0 18px;border-radius:14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.btn:hover{filter:brightness(1.07)}
.btn.p{background:var(--blue);color:#fff}.btn.s{background:var(--soft);color:var(--blue)}.btn.d{background:#FDECEC;color:var(--red)}.btn.n{background:var(--navy);color:#fff}
.ib{width:42px;height:42px;border-radius:14px;background:var(--field);display:grid;place-items:center;transition:.2s;flex:none}.ib:hover{background:var(--soft);color:var(--blue)}
.empty{text-align:center;padding:60px 20px;color:var(--mut);font-weight:700}.empty .ci{margin:0 auto 14px;width:64px;height:64px;border-radius:22px}.empty .ci svg{width:28px;height:28px}
/* Окна */
.ov{position:fixed;inset:0;background:rgba(10,20,80,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:fi .25s both;transition:opacity .2s}
.ov.out{opacity:0}@keyframes fi{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:720px;max-height:100%;display:flex;flex-direction:column;overflow:hidden;border-radius:30px;animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both}
.sheet.sm{max-width:440px}
.mh{padding:22px 24px 10px}
.sb{overflow:auto;padding:6px 24px 16px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.sf{padding:12px 24px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:#fff}
.sf .btn{grid-column:span 3;min-width:0;padding:0 8px}
.sf .btn:nth-child(n+3){grid-column:span 2;flex-direction:column;height:58px;gap:3px;font-size:12px}
.sf .cta{grid-column:1/-1;margin:0}
.btn.s.on{background:var(--blue);color:#fff}.btn.on svg{fill:currentColor}
.pdfx{display:grid;place-items:center;gap:12px;text-align:center;padding:20px;color:var(--mut);font-weight:600;font-size:13px;line-height:1.5}.pdfx .th{width:96px;height:96px}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.mh h2{font-size:26px;letter-spacing:-.02em;margin-top:6px}
.chip{display:inline-block;background:var(--soft);color:var(--blue);font-weight:700;font-size:13px;padding:5px 12px;border-radius:99px}
.pv{height:300px;border-radius:22px;background:var(--field);overflow:hidden;display:grid;place-items:center;margin:18px 0}
.pv img{width:100%;height:100%;object-fit:contain}.pv object{width:100%;height:100%}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.meta div{background:var(--field);border-radius:16px;padding:12px 14px}.meta small{display:block;color:var(--mut);font-weight:600;font-size:12px;margin-bottom:3px}.meta b{font-size:14px}
.ds{color:var(--mut);font-weight:600;line-height:1.6;margin-top:14px}
.mb{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.mb .btn{flex:1;min-width:130px}
.fm{display:grid;gap:14px;margin-top:18px}.f{display:grid;gap:7px;font-weight:700;font-size:14px}
.fi{width:100%;background:var(--field);border:2px solid transparent;border-radius:16px;padding:14px 16px;outline:0;font-weight:600;transition:.2s;resize:vertical}.fi:focus{background:#fff;border-color:var(--blue)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px;border:2px dashed var(--soft2);border-radius:22px;background:#F8FAFF;color:var(--blue);font-weight:700;cursor:pointer;text-align:center;transition:.2s}
.drop:hover,.drop.hv{background:var(--soft)}.drop small{color:var(--mut)}
.pk{display:flex;align-items:center;gap:14px;background:var(--field);border-radius:18px;padding:12px}.pk .th{width:60px;height:60px;border-radius:16px}.pk p{font-weight:700;word-break:break-all}.pk small{color:var(--mut);font-weight:600}
.shr{display:grid;gap:8px;margin-top:16px}.shr button{display:flex;align-items:center;gap:14px;padding:12px;border-radius:18px;background:var(--field);font-weight:700;text-align:left;transition:.2s}.shr button:hover{background:var(--soft)}
.shr .ci{margin:0;width:42px;height:42px;border-radius:14px;background:#fff}
.note{color:var(--mut);font-size:12.5px;font-weight:600;line-height:1.5;margin-top:14px}
.menu{position:fixed;z-index:60;background:#fff;border-radius:18px;padding:6px;box-shadow:0 18px 50px rgba(10,20,80,.2);border:1px solid var(--line);min-width:200px;animation:pop .2s both}
.menu button{display:flex;gap:10px;width:100%;padding:11px 12px;border-radius:12px;font-weight:700;font-size:14px;align-items:center}.menu button:hover{background:var(--field)}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:90;background:var(--navy);color:#fff;padding:14px 22px;border-radius:18px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 14px 40px rgba(10,20,80,.3);animation:tin .35s both;transition:.3s}
.toast.out{opacity:0;transform:translate(-50%,10px)}.toast.err svg{color:#FF8A8F}.toast svg{color:#7FE3A5}
@keyframes tin{from{opacity:0;transform:translate(-50%,20px)}}
.card{border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:var(--sh);margin-bottom:16px;display:grid;gap:14px}.card h3{font-size:18px}
.card p{color:var(--mut);font-weight:600;line-height:1.6}
@media(max-width:860px){
.side{display:none}.tabs{display:flex}
.main{margin:0;padding:22px 18px 130px}
.hero{padding:18px;min-height:172px;display:flex;align-items:center}.hero .tx{max-width:54%}.hero .tg{display:none}.hero small{font-size:13px;margin-bottom:4px}.hero b{font-size:44px}.hero em{font-size:15px;margin-left:6px}.hs{gap:6px;margin-top:10px}.hs span{padding:6px 10px;font-size:12px}
.mascot{height:158px;right:-6px}.hero:before{width:230px;height:230px;right:-40px;bottom:-70px}
.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{padding:10px;border-radius:20px;min-width:0;overflow:hidden}.tile b{font-size:11.5px}.tile span{font-size:11px}.tile .ci{width:38px;height:38px;border-radius:13px}
.top>.btn{display:none}
.mh,.sb,.sf{padding-left:18px;padding-right:18px}.mh h2{font-size:22px}
.top h1{font-size:28px}
.ov{padding:12px 0 0;align-items:flex-end}.sheet{max-width:none;border-radius:28px 28px 0 0}.ov.full .sheet{height:100%}
.pv{height:240px}.toast{bottom:104px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#lg{position:fixed;inset:0;z-index:100;background:#fff;display:grid;place-items:center;padding:24px}
.lgb{width:100%;max-width:360px;display:grid;gap:14px;text-align:center;justify-items:center}.lgb h1{font-size:34px;letter-spacing:-.03em}.lgb p{color:var(--mut);font-weight:600}
.lgb .fi,.lgb .cta{width:100%}.logo.big{width:68px;height:68px;border-radius:22px}.logo.big svg{width:32px;height:32px}
#lerr{color:var(--red);font-weight:700;min-height:18px;font-size:14px}
.from{display:inline-block;margin-top:6px;background:#EEF0F3;color:#5B6475;font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:8px}.from.big{font-size:14px;margin:0 0 12px}
.qrb{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;max-width:300px;margin:6px auto 12px}.qrb svg{display:block;width:100%;height:auto}
.scn{border-radius:22px;overflow:hidden;background:#0B1330;aspect-ratio:1;margin-top:4px}.scn video{width:100%;height:100%;object-fit:cover}
.still .dc,.still .tile,.still .cat{animation:none}
.cg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cg label{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--field);border:2px solid transparent;font-weight:700;font-size:14px;cursor:pointer;transition:border-color .15s,background .15s;min-width:0}
.cg input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.cg .ci{margin:0;width:34px;height:34px;border-radius:11px;background:#fff;flex:none}.cg .ci svg{width:17px;height:17px}
.cg input:checked+.ci{background:var(--blue);color:#fff}.cg input:checked~b{color:var(--blue)}
.cg label:has(input:checked){background:var(--soft);border-color:var(--blue)}
@media(max-width:430px){.acts .btn svg{display:none}.acts .btn{padding:0 8px}}
.memo{margin-top:14px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.14);max-width:520px}
.memo .mt{font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:8px}
.memo .mg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.memo span{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;line-height:1.25}
.memo i{font-style:normal;flex:none;width:24px;height:24px;border-radius:8px;background:#fff;color:var(--blue-d);display:grid;place-items:center;font-weight:800;font-size:13px}
@media(max-width:860px){.memo{margin-top:10px;padding:10px}.memo .mg{grid-template-columns:1fr;gap:5px}.memo span{font-size:11px}.memo i{width:20px;height:20px;border-radius:7px;font-size:11px}.hero .tx{max-width:62%}}
</style>
</head>
<body>
<aside class="side" id="side"></aside>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== Хранилище: localStorage (данные) + IndexedDB (файлы) ===== */
const db=new Promise((res,rej)=>{const r=indexedDB.open('docly',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(m,f)=>db.then(d=>new Promise((res,rej)=>{const t=d.transaction('f',m),q=f(t.objectStore('f'));t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error)}));

let me=localStorage.getItem('docly.user');if(!USERS[me])me=null;
let docs=null,prof={name:''};
const dkey=()=>'docly.docs.'+me,gkey=()=>'docly.gone.'+me;
// Настройки интерфейса: что показывать (off = выключенные категории)
let prefs=Object.assign({cats:true,recent:true,off:[]},JSON.parse(localStorage.getItem('docly.prefs')||'{}'));
const savePrefs=()=>localStorage.setItem('docly.prefs',JSON.stringify(prefs));
const enCats=()=>CATS.filter(c=>!prefs.off.includes(c[0]));
const files=new Map(),urls=new Map();
const save=()=>localStorage.setItem(dkey(),JSON.stringify(docs));
const url=id=>{if(files.has(id)){if(!urls.has(id))urls.set(id,URL.createObjectURL(files.get(id)));return urls.get(id)}const d=get(id);return d&&d.src?encodeURI(d.src):''};
const get=id=>docs.find(d=>d.id===id);

function mkPdf(t){ // минимальный валидный PDF для демо
 const s=`BT /F1 26 Tf 72 740 Td (${translit(t).replace(/[^ -~]/g,'')}) Tj 0 -40 Td /F1 14 Tf (Docly demo document) Tj ET`;
 const o=['<</Type/Catalog/Pages 2 0 R>>','<</Type/Pages/Kids[3 0 R]/Count 1>>','<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 4 0 R>>>>/Contents 5 0 R>>','<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>',`<</Length ${s.length}>>\nstream\n${s}\nendstream`];
 let p='%PDF-1.4\n',x=[];o.forEach((b,i)=>{x.push(p.length);p+=`${i+1} 0 obj\n${b}\nendobj\n`});
 const xs=p.length;p+=`xref\n0 ${o.length+1}\n0000000000 65535 f \n`+x.map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${o.length+1}/Root 1 0 R>>\nstartxref\n${xs}\n%%EOF`;
 return new Blob([p],{type:'application/pdf'});
}
const mkSvg=()=>new Blob(['<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C9BFF"/><stop offset="1" stop-color="#1E3FB2"/></linearGradient></defs><rect width="640" height="400" rx="36" fill="url(#g)"/><text x="60" y="70" font-family="Arial" font-size="26" font-weight="700" fill="#fff">DOCLY DEMO</text><circle cx="120" cy="170" r="52" fill="#fff" fill-opacity=".3"/><rect x="210" y="130" width="320" height="22" rx="11" fill="#fff" fill-opacity=".7"/><rect x="210" y="176" width="220" height="16" rx="8" fill="#fff" fill-opacity=".4"/><rect x="60" y="290" width="520" height="16" rx="8" fill="#fff" fill-opacity=".3"/><rect x="60" y="326" width="380" height="16" rx="8" fill="#fff" fill-opacity=".3"/></svg>'],{type:'image/svg+xml'});

const LK={'К':'K','В':'B','х':'x'},LKr={'K':'К','B':'В','x':'х'};
const swp=(p,m)=>p.replace(/\([^)]*\)/g,t=>t.replace(/./g,c=>m[c]||c)).replace(/(\d)([xх])(\d)/g,(_,a,b,c)=>a+(m[b]||b)+c);
async function fetchBlob(path){
 const base=[path,path.normalize('NFC'),path.normalize('NFD'),swp(path,LK),swp(path,LKr)],all=new Set();
 base.forEach(b=>{[b,b.replace('Аттетсат','Аттестат'),b.replace('Аттестат','Аттетсат')].forEach(t=>{all.add(t);all.add(t.replace(/ \(/,'('));all.add(t.replace(/(\S)\(/,'$1 ('))})});
 for(const v of all){
  try{const r=await fetch(encodeURI(v));if(r.ok){const b=await r.blob();return new Blob([b],{type:/\.pdf$/i.test(v)?'application/pdf':b.type})}}catch(e){}
 }
 throw 0;
}
async function blobOf(d){
 if(files.has(d.id))return files.get(d.id);
 let b=null;try{b=await tx('readonly',s=>s.get(d.id))}catch(e){}
 if(!b&&d.src)b=await fetchBlob(d.src);
 if(b)files.set(d.id,b);return b;
}
async function init(){
 prof={name:USERS[me].name};
 docs=JSON.parse(localStorage.getItem(dkey())||'[]');
 const gone=JSON.parse(localStorage.getItem(gkey())||'[]');let add=0;
 (SEED[me]||[]).forEach(([title,src,cat],i)=>{const id='seed-'+me+'-'+i;
  if(gone.includes(id)||docs.some(d=>d.id===id))return;
  docs.push({id,title,cat,desc:'',kw:'',date:Date.now()-i*1000,size:0,mime:'application/pdf',fav:false,src});add=1});
 if(add)save();
 render();incoming();
 loadBlobs();
}
async function loadBlobs(){
 const bad=[];
 await Promise.all(docs.map(async d=>{
  try{
   let b=null;try{b=await tx('readonly',s=>s.get(d.id))}catch(e){}
   if(!b&&d.src){b=await fetchBlob(d.src);try{await tx('readwrite',s=>s.put(b,d.id))}catch(e){}}
   if(b){files.set(d.id,b);d.size=b.size;if(b.type&&EXT[b.type])d.mime=b.type}else bad.push(d);
  }catch(e){bad.push(d)}
 }));
 if(bad.length){docs=docs.filter(d=>!bad.includes(d));const m=bad.filter(d=>d.src).map(d=>d.src);
  if(m.length)toast('Не найден файл: '+m[0]+(m.length>1?' и ещё '+(m.length-1):''),1)}
 save();dyn();
}

/* ===== QR: передача документа ===== */
const b64=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const unb64=t=>JSON.parse(decodeURIComponent(escape(atob(t))));
function qrModal(id){
 const d=get(id);
 if(!d.src)return modal(`<div class="mh"><h2>QR-код</h2><button class="ib" data-a="close">${ic('x')}</button></div><div class="sb"><p class="ds" style="margin-top:0">QR работает для документов, которые лежат в папке сайта рядом с index.html. Файл, загруженный вручную, хранится только в этом браузере и не может быть передан по QR.</p></div>`,'sm',id);
 const link=location.origin+location.pathname+'?r='+encodeURIComponent(b64({f:me,s:d.src,t:d.title,c:d.cat}));
 if(!window.qrcode)(0,eval)($('#qrlib').textContent);const q=qrcode(0,'L');q.addData(link);q.make();
 modal(`<div class="mh"><h2>QR-код документа</h2><button class="ib" data-a="close">${ic('x')}</button></div><div class="sb"><div class="qrb">${q.createSvgTag({cellSize:6,margin:2,scalable:true})}</div>
 <p class="ds" style="text-align:center"><b>${esc(d.title)}</b></p><p class="note" style="text-align:center">Получателю: Настройки → «Сканировать QR». Документ появится у него с пометкой, от кого он.</p></div>`,'sm',id);
}
async function receive(text){
 const m=String(text).match(/[?&]r=([^&\s]+)/);if(!m)return toast('Это не QR документа Docly',1);
 let p;try{p=unb64(decodeURIComponent(m[1]))}catch(e){return toast('QR повреждён',1)}
 if(!USERS[p.f]||!p.s)return toast('QR не распознан',1);
 if(p.f===me)return toast('Это ваш собственный документ',1);
 if(docs.some(d=>d.src===p.s&&d.from===USERS[p.f].name))return toast('Этот документ уже у вас');
 try{const b=await fetchBlob(p.s),id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  files.set(id,b);try{await tx('readwrite',s=>s.put(b,id))}catch(e){}
  docs.unshift({id,title:p.t||'Документ',cat:CATS.some(c=>c[0]===p.c)?p.c:'id',desc:'',kw:'',date:Date.now(),size:b.size,mime:b.type,fav:false,src:p.s,from:USERS[p.f].name});
  save();document.querySelectorAll('.ov').forEach(o=>o.remove());go('docs');toast('Документ получен')}
 catch(e){toast('Не удалось загрузить документ',1)}
}
function incoming(){const m=location.search.match(/[?&]r=([^&]+)/);if(!m)return;history.replaceState(null,'',location.pathname);receive('?r='+m[1])}
let cam=null;
function stopCam(){if(cam){cam.stop=1;cam.s?.getTracks().forEach(t=>t.stop());cam=null}}
async function scanModal(){
 modal(`<div class="mh"><h2>Сканировать QR</h2><button class="ib" data-a="close">${ic('x')}</button></div><div class="sb"><div class="scn"><video id="vd" playsinline muted></video></div><p class="note" id="sm">Наведите камеру на QR-код документа</p></div>`,'sm');
 cam={};const me_=cam;
 try{
  if(!window.jsQR)(0,eval)($('#jsqr').textContent);
  me_.s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  const v=$('#vd');v.srcObject=me_.s;await v.play();
  const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
  const loop=()=>{
   if(me_.stop||!$('#vd'))return stopCam();
   if(v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);
    const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
    if(r&&r.data){stopCam();return receive(r.data)}}
   setTimeout(loop,120)};
  loop();
 }catch(e){const t=$('#sm');if(t)t.textContent='Нет доступа к камере. Разрешите камеру в браузере или откройте QR-ссылку.'}
}

function render(){
 const v=S.v;renderNav();let h;
 if(v==='home')h=`<div class="top"><div><h1>${greet()}</h1><p>Ваши документы всегда рядом.</p></div><div class="av">${ini()}</div></div>${searchBox()}<div id="dyn"></div>`;
 else if(v==='set'){
  const sw=(k,on,a)=>`<label class="sw"><input type="checkbox" ${a}="${k}" ${on?'checked':''}><i></i></label>`;
  h=`<div class="top"><div><h1>Настройки</h1><p>Профиль, QR и категории</p></div></div>

  <div class="row"><div>ФИО<small>${esc(prof.name)}</small></div></div><div class="row"><div>Дата рождения<small>${USERS[me].born}</small></div></div><div class="row"><div>ID аккаунта<small>${me}</small></div></div>
  <button class="btn s" data-a="logout">Выйти из аккаунта</button></div>
  <div class="card"><h3>Получить документ</h3><p>Отсканируйте QR-код документа, который вам отправили через Docly.</p><button class="cta" data-a="scan">${ic('qr')}Сканировать QR</button></div>
  <div class="card"><h3>Главный экран</h3>
  <div class="row"><div class="ci">${ic('folder')}</div><div>Категории<small>Ряд карточек категорий</small></div>${sw('cats',prefs.cats,'data-pref')}</div>
  <div class="row"><div class="ci">${ic('doc')}</div><div>Последние документы<small>Сворачиваемый список</small></div>${sw('recent',prefs.recent,'data-pref')}</div></div>
  <div class="card"><h3>Категории документов</h3>${CATS.map(c=>`<div class="row"><div class="ci">${ic(c[2])}</div><div>${c[1]}</div>${sw(c[0],!prefs.off.includes(c[0]),'data-cat')}</div>`).join('')}</div>
  <div class="card"><h3>Хранилище</h3><p>${docs.length} ${word(docs.length)} · ${fmt(docs.reduce((a,d)=>a+d.size,0))}. Файлы хранятся только в этом браузере (IndexedDB), на сервер ничего не отправляется.</p></div>`;
 }else{
  const cat=v.startsWith('c:'),t=v==='docs'?'Документы':v==='favs'?'Избранное':catName(v.slice(2));
  h=`<div class="top"><div style="display:flex;align-items:center;gap:14px">${cat?`<button class="ib" data-go="docs" aria-label="Назад">${ic('back')}</button>`:''}<div><h1>${t}</h1><p id="cnt"></p></div></div>${addBtn()}</div>${searchBox()}<div id="dyn" style="margin-top:18px"></div>`;
 }
 $('#main').innerHTML=`<div class="pg">${h}</div>`;
 dyn(1);
}

const base=()=>{const v=S.v;return docs.filter(d=>v==='favs'?d.fav:v.startsWith('c:')?d.cat===v.slice(2):true).sort((a,b)=>b.date-a.date)};
const match=(d,q)=>{const hay=(d.title+' '+catName(d.cat)+' '+d.desc+' '+d.kw).toLowerCase();return q.toLowerCase().split(/\s+/).filter(Boolean).every(t=>hay.includes(t))};

function thumb(d){return isImg(d)?(files.has(d.id)?`<div class="th"><img src="${url(d.id)}" alt="" decoding="async"></div>`:'<div class="th"></div>'):`<div class="th pdf">${ic('doc')}<b>PDF</b></div>`}
const card=(d,i)=>`<article class="dc" data-id="${d.id}" style="--d:${Math.min(i,8)*.05}s">${thumb(d)}
<div class="inf"><h3>${esc(d.title)}</h3><p>${esc(catName(d.cat))} · ${fdate(d.date)}</p><p>${EXT[d.mime].toUpperCase()} · ${fmt(d.size)}</p>${d.from?`<span class="from">От кого: ${esc(d.from)}</span>`:''}</div>
${d.fav?`<span class="fv">${ic('star')}</span>`:''}
<div class="acts"><button class="btn p" data-a="open">${ic('ext')}Открыть</button><button class="btn s" data-a="dl">${ic('dl')}Скачать</button><button class="ib" data-a="edit" aria-label="Изменить" title="Изменить категорию">${ic('edit')}</button><button class="ib" data-a="more" aria-label="Ещё">${ic('more')}</button></div></article>`;

function dyn(anim){

 const q=S.q.trim(),v=S.v,cn=$('#cnt');let h='';
 const lst=r=>r.length?`<div class="list">${r.map(card).join('')}</div>`:empty();

 if(v==='home'&&!q){

  if(prefs.recent){const r=base().slice(0,4);h+=`<button class="fh ${S.recent?'open':''}" data-a="fold"><h2>Последние документы</h2><span>${r.length}${ic('chev')}</span></button><div class="fold ${S.recent?'open':''}"><div>${lst(r)}</div></div>`}
 }else if(v==='docs'&&!q){

 }else{

 el.innerHTML=h;{const cs=el.querySelector('.cats');if(cs)cs.addEventListener('wheel',catsWheel,{passive:false})}

<div class="sb"><div class="pv">${isImg(d)?`<img src="${url(d.id)}" alt="">`:navigator.pdfViewerEnabled?`<object data-src="${url(d.id)}" type="application/pdf">${pdfx()}</object>`:pdfx()}</div>
<div class="meta"><div><small>Категория</small><b>${esc(catName(d.cat))}</b></div><div><small>Добавлен</small><b>${fdate(d.date)}</b></div><div><small>Размер</small><b>${fmt(d.size)}</b></div><div><small>Тип</small><b>${EXT[d.mime].toUpperCase()}</b></div></div>
${d.from?`<span class="from big">От кого: ${esc(d.from)}</span>`:''}${d.desc?`<p class="ds">${esc(d.desc)}</p>`:''}</div>
<div class="sf"><button class="btn p" data-a="open">${ic('ext')}Открыть</button><button class="btn s" data-a="dl">${ic('dl')}Скачать</button><button class="btn s ${d.fav?'on':''}" data-a="fav">${ic('star')}Избранное</button><button class="btn s" data-a="share">${ic('share')}Поделиться</button><button class="btn s" data-a="edit">${ic('edit')}Изменить</button><button class="btn d" data-a="del">${ic('trash')}Удалить</button></div>`;
function armPv(ms){setTimeout(()=>{const o=document.querySelector('.pv object[data-src]');if(o&&!o.data)o.data=o.dataset.src},ms)}
const openDoc=id=>{modal(detail(get(id)),'full',id);armPv(380)};

/* ===== Действия ===== */
function download(d){const a=document.createElement('a');a.href=url(d.id);a.download=slug(d.title)+'.'+EXT[d.mime];document.body.appendChild(a);a.click();a.remove()}
function toggleFav(d){d.fav=!d.fav;save();toast(d.fav?'Добавлено в избранное':'Убрано из избранного');dyn();const s=$('.ov.full .sheet');if(s&&s.dataset.id===d.id){s.innerHTML=detail(d);armPv(0)}}
// Свой диалог вместо confirm(): во встроенных браузерах (Telegram и др.) confirm() часто блокируется
function editModal(id){const d=get(id);
 modal(`<div class="mh"><h2>Изменить документ</h2><button class="ib" data-a="close">${ic('x')}</button></div><div class="sb"><div class="fm" style="margin-top:4px">
 <label class="f">Название<input class="fi" id="et" value="${esc(d.title)}"></label>
 <div class="f">Категория<div class="cg">${CATS.map(c=>`<label><input type="radio" name="ec" value="${c[0]}" ${c[0]===d.cat?'checked':''}><span class="ci">${ic(c[2])}</span><b>${c[1]}</b></label>`).join('')}</div></div></div></div>
 <div class="sf"><button class="cta" data-a="editok">Сохранить</button></div>`,'sm',id)}
function saveEdit(id){const d=get(id),r=document.querySelector('input[name="ec"]:checked');
 d.title=$('#et').value.trim()||d.title;if(r)d.cat=r.value;save();closeTop();dyn();renderNav();
 const s=$('.ov.full .sheet');if(s&&s.dataset.id===id){s.innerHTML=detail(d);armPv(0)}toast('Изменения сохранены')}
function confirmDel(d){modal(`<div class="mh"><h2>Удалить документ?</h2></div><div class="sb"><p class="ds" style="margin-top:0">«${esc(d.title)}» будет удалён из хранилища без возможности восстановления.</p></div><div class="sf"><button class="btn s" data-a="close">Отмена</button><button class="btn d" data-a="delok">${ic('trash')}Удалить</button></div>`,'sm',d.id)}
async function remove(d){
 if(d.id.startsWith('seed-')){const g=JSON.parse(localStorage.getItem(gkey())||'[]');g.push(d.id);localStorage.setItem(gkey(),JSON.stringify(g))}
 docs=docs.filter(x=>x.id!==d.id);save();files.delete(d.id);if(urls.has(d.id)){URL.revokeObjectURL(urls.get(d.id));urls.delete(d.id)}
 try{await tx('readwrite',s=>s.delete(d.id))}catch(e){}
 document.querySelectorAll('.ov').forEach(o=>o.remove());dyn();toast('Документ удалён');
}
function shareSheet(id){modal(`<div class="mh"><h2>Поделиться</h2><button class="ib" data-a="close">${ic('x')}</button></div>
<div class="sb"><div class="shr" style="margin-top:4px"><button data-a="tg"><div class="ci">${ic('tg')}</div>Telegram</button><button data-a="wa"><div class="ci">${ic('wa')}</div>WhatsApp</button><button data-a="nat"><div class="ci">${ic('share')}</div>Поделиться</button><button data-a="qr"><div class="ci">${ic('qr')}</div>QR-код</button></div>
<p class="note">Telegram и WhatsApp отправят сам файл через меню телефона. Если браузер не поддерживает отправку файлов, уйдёт ссылка на документ.</p></div>`,'sm',id)}
const fname=d=>d.title.replace(/[\\/:*?"<>|]+/g,' ').trim()+'.'+EXT[d.mime];
// Отправка именно файлом: системное меню «Поделиться» (там Telegram и WhatsApp). Если браузер не умеет — ссылка на файл.
async function shareFile(d,app){
 const f=new File([await blobOf(d)],fname(d),{type:d.mime});
 if(navigator.canShare&&navigator.canShare({files:[f]})){
  try{await navigator.share({files:[f],title:d.title});return}catch(e){if(e&&e.name==='AbortError')return}
 }
 const link=d.src?location.origin+location.pathname.replace(/[^/]*$/,'')+encodeURI(d.src):'';
 if(!link){download(d);toast('Файл скачан — прикрепите его в чате',0)}
 window.open(app==='tg'?'https://t.me/share/url?url='+encodeURIComponent(link||location.href)+'&text='+encodeURIComponent(d.title):'https://wa.me/?text='+encodeURIComponent(d.title+(link?'\n'+link:'')),'_blank');
}
async function nativeShare(d){
 const f=new File([await blobOf(d)],fname(d),{type:d.mime});
 try{
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({title:d.title,files:[f]});
  else if(navigator.share)await navigator.share({title:d.title,text:d.title+' — Docly'});
  else toast('Браузер не поддерживает «Поделиться»',1);
 }catch(e){}
}

/* ===== Добавление документа ===== */
let pick=null;
function addModal(){
 pick=null;const cs=enCats().length?enCats():CATS;
 modal(`<div class="mh"><h2>Новый документ</h2><button class="ib" data-a="close">${ic('x')}</button></div><div class="sb"><div class="fm" style="margin-top:4px">
 <label class="f">Название документа<input class="fi" id="ft" placeholder="Например, Медицинская справка"></label>
 <label class="f">Категория<select class="fi" id="fc">${cs.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></label>
 <label class="f">Описание<textarea class="fi" id="fd" rows="2" placeholder="Коротко о документе"></textarea></label>
 <label class="f">Ключевые слова<input class="fi" id="fk" placeholder="Через пробел"></label>
 <label class="drop" id="dz"><input type="file" id="ff" hidden accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg">${ic('upload')}<span>Выберите файл или перетащите сюда</span><small>PDF, PNG, JPG, JPEG</small></label>
 <div id="pk"></div></div></div><div class="sf"><button class="cta" data-a="save">Сохранить документ</button></div>`,'full');
}
function setFile(f){
 if(!f)return;
 const e=(f.name.split('.').pop()||'').toLowerCase(),m={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg'}[e];
 if(!m)return toast('Поддерживаются PDF, PNG и JPG',1);
 pick={file:f,mime:m};
 const t=$('#ft');if(t&&!t.value)t.value=f.name.replace(/\.[^.]+$/,'');
 $('#pk').innerHTML=`<div class="pk">${m.startsWith('image/')?`<div class="th"><img src="${URL.createObjectURL(f)}" alt=""></div>`:`<div class="th pdf">${ic('doc')}<b>PDF</b></div>`}<div><p>${esc(f.name)}</p><small>${fmt(f.size)}</small></div></div>`;
}
async function saveDoc(){
 if(!pick)return toast('Сначала выберите файл',1);
 const id='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),b=new Blob([pick.file],{type:pick.mime});
 const d={id,title:$('#ft').value.trim()||'Без названия',cat:$('#fc').value,desc:$('#fd').value.trim(),kw:$('#fk').value.trim(),date:Date.now(),size:b.size,mime:pick.mime,fav:false};
 files.set(id,b);try{await tx('readwrite',s=>s.put(b,id))}catch(e){}
 docs.unshift(d);save();closeTop();dyn();toast('Документ сохранён');
}

/* ===== События ===== */
document.addEventListener('click',e=>{
 if(!e.target.closest('.menu,[data-a=more]'))$('.menu')?.remove();
 if(e.target.classList.contains('ov'))return closeTop();
 const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);
 const b=e.target.closest('[data-a]');
 if(b){
  const a=b.dataset.a,id=b.closest('[data-id]')?.dataset.id,d=id&&get(id);
  if(a==='more'){
   const old=$('.menu');if(old){old.remove();return}
   const r=b.getBoundingClientRect(),m=document.createElement('div');m.className='menu';m.dataset.id=id;
   m.innerHTML=`<button data-a="share">${ic('share')}Поделиться</button><button data-a="edit">${ic('edit')}Изменить</button><button data-a="fav">${ic('star')}${d.fav?'Убрать из избранного':'В избранное'}</button><button data-a="del" style="color:var(--red)">${ic('trash')}Удалить</button>`;
   document.body.appendChild(m);m.style.top=Math.min(r.bottom+6,innerHeight-160)+'px';m.style.left=Math.max(10,Math.min(r.right-200,innerWidth-210))+'px';return;
  }
  if(a==='open')window.open(url(id),'_blank');
  else if(a==='dl')download(d);
  else if(a==='add')addModal();
  else if(a==='close')closeTop();
  else if(a==='save')saveDoc();
  else if(a==='share')shareSheet(id);
  else if(a==='fav')toggleFav(d);
  else if(a==='del')confirmDel(d);
  else if(a==='delok')remove(d);
  else if(a==='fold'){S.recent=!S.recent;document.querySelectorAll('.fh,.fold').forEach(x=>x.classList.toggle('open',S.recent))}
  else if(a==='tg'||a==='wa')shareFile(d,a);
  else if(a==='nat')nativeShare(d);
  else if(a==='qr')qrModal(id);
  else if(a==='edit')editModal(id);
  else if(a==='editok')saveEdit(id);
  else if(a==='scan')scanModal();
  else if(a==='login')doLogin();
  else if(a==='logout'){localStorage.removeItem('docly.user');location.href=location.pathname}
  $('.menu')?.remove();return;
 }
 const c=e.target.closest('.dc');if(c)openDoc(c.dataset.id);
});
document.addEventListener('input',e=>{
 if(e.target.id==='q'){S.q=e.target.value;dyn()}
 if(e.target.id==='pn'||e.target.id==='pe'){prof.name=$('#pn').value;prof.email=$('#pe').value;localStorage.setItem('docly.prof',JSON.stringify(prof));$('#pav').textContent=ini()}
});
document.addEventListener('change',e=>{
 const t=e.target;if(t.id==='ff')setFile(t.files[0]);
 if(t.dataset.pref){prefs[t.dataset.pref]=t.checked;savePrefs()}
 if(t.dataset.cat){prefs.off=prefs.off.filter(x=>x!==t.dataset.cat);if(!t.checked)prefs.off.push(t.dataset.cat);savePrefs();renderNav()}
});
document.addEventListener('dragover',e=>{if(e.target.closest('#dz')){e.preventDefault();$('#dz').classList.add('hv')}});
document.addEventListener('dragleave',e=>{$('#dz')?.classList.remove('hv')});
document.addEventListener('drop',e=>{if(e.target.closest('#dz')){e.preventDefault();$('#dz').classList.remove('hv');setFile(e.dataTransfer.files[0])}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTop();if(e.key==='Enter'&&$('#lid'))doLogin()});
// Колёсико мыши листает ряд категорий влево-вправо (на краях прокручивает страницу как обычно)
function catsWheel(e){
 const c=e.currentTarget;if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
 const max=c.scrollWidth-c.clientWidth,d=e.deltaY;
 if(max>0&&((d>0&&c.scrollLeft<max-1)||(d<0&&c.scrollLeft>0))){c.scrollLeft+=d;e.preventDefault()}
}
// Пока открыто любое окно, страница под ним не прокручивается
let lockY=0;
new MutationObserver(()=>{const open=!!document.querySelector('.ov'),b=document.body;
 if(open&&!b.classList.contains('lock')){lockY=scrollY;b.style.top=-lockY+'px';b.classList.add('lock')}
 else if(!open&&b.classList.contains('lock')){b.classList.remove('lock');b.style.top='';scrollTo(0,lockY)}
}).observe(document.body,{childList:true});
me?init():login();
</script>
</body>
</html>
